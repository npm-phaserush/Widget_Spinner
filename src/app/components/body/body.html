<div
  class="flex flex-row items-center justify-center w-full absolute top-[70px]">
  <app-prizes-card
    [titleImage]="'assets/images/minor.png'"
    [subtitleImage]="'assets/images/prizes.png'"
    [variant]="'minor'"
    [active]="selectedVariant === 'minor'"
    (picked)="onVariantPicked($event)"
    image="assets/images/small_roulette1.webp"></app-prizes-card>
  <app-prizes-card
    [titleImage]="'assets/images/major.png'"
    [subtitleImage]="'assets/images/prizes.png'"
    [variant]="'major'"
    [active]="selectedVariant === 'major'"
    (picked)="onVariantPicked($event)"
    image="assets/images/small_roulette2.webp"></app-prizes-card>
  <app-prizes-card
    [titleImage]="'assets/images/grand.png'"
    [subtitleImage]="'assets/images/prizes.png'"
    [variant]="'grands'"
    [active]="selectedVariant === 'grand'"
    (picked)="onVariantPicked($event)"
    image="assets/images/small_roulette3.webp"></app-prizes-card>
  <app-level [variant]="currentVariant"></app-level>
</div>

<div
  class="flex flex-row items-center justify-center w-full absolute top-[150px]">

  <img #rimImg [src]="rimImage" alt=""
    class="w-[330px] h-[330px] block rim-img"
    [style.--rim-filter-a]="rimFilterA"
    [style.--rim-filter-b]="rimFilterB">


  <div class="absolute inset-0 flex justify-center items-center wheel-container m-0">
    <div #wheel class="relative rounded-full border-[2px] border-yellow-400 overflow-hidden origin-center wheel
              w-[226px] h-[226px]"
      [style.--rim-glow-0]="rimGlow0"
      [style.--rim-glow-1]="rimGlow1">

      <!-- Wheel Slices -->
      @for (slice of slices; track $index; let i = $index) {
        <div
          class="absolute w-1/2 h-1/2 top-1/2 left-1/2 origin-top-left slice"
          [style.transform]="sliceTransforms[i]"
          [style.background]="sliceBackgrounds[i]">
        </div>
      }

      <!-- Floating labels  -->
      @for (slice of slices; track $index; let i = $index) {
        <div
          class="absolute flex flex-col items-center justify-center text-center floating-label"
          [style.transform]="labelPositions[i]">
          <img [src]="slice.image" alt="" class="label-image" />
          <span class="label-text" [innerHTML]="slice.title"></span>
        </div>
      }

    </div>
    <!-- Rim Bulbs -->
    <div #rimBulbs
      class="absolute top-1/2 left-1/2 w-[330px] h-[340px] transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-30 rim-bulbs"
      [style.--bulb-base]="bulbBaseColor"
      [style.--bulb-glow-0]="bulbGlow0"
      [style.--bulb-glow-1]="bulbGlow1"
      [style.--bulb-background]="bulbGradient"
      [style.--bulb-border]="bulbBorderColor">
      <!-- Top bulb -->
    <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[10%] left-[47%]">
      </div>
      <!-- Top-right bulb -->
    <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600 shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[18%] left-[77%]">
      </div>

      <!-- Right bulb -->
    <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[35%] left-[86%]">
      </div>

      <!-- Bottom-right bulb -->
  <div
    class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[53%] left-[78%]">
      </div>

      <!-- Bottom bulb -->
  <div
    class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[60%] left-[48.5%]">
      </div>

      <!-- Bottom-left bulb -->
    <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[43%] left-[16%]">
      </div>
      <!-- Left bulb -->
      <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[13%] left-[8%]">
      </div>
      <!-- Top-left bulb -->
      <div class="absolute rounded-full bg-gradient-radial from-yellow-100 via-yellow-400 to-yellow-600
  shadow-bulb animate-bulbGlow bulb
  w-4 h-4
  top-[-15%] left-[16%]">
      </div>

    </div>

    <!-- Ribbon -->
    <div
      class="absolute top-38 left-1/2 transform -translate-x-1/2 z-50 ribbon">
      <img src="assets/images/ribbon.webp" alt=""
        decoding="async" class="w-[300px] h-[280px] ribbon-img">
    </div>

    <!-- Arrow Button -->
    <div class="absolute left-1/2 transform -translate-x-1/2 z-5 arrow">
      <img #arrowBtn src="assets/images/arrw-btn.webp" alt="" class="h-15">
    </div>
  </div>


  <!-- Winner Banner -->
  <div #winnerBanner class=" winner-banner ">
    @if (winnerImage) {
      <img [src]="winnerImage" alt="Prize"
        loading="lazy" class="winner-img object-contain" />
    }
    <span #winnerTextRef class="text-center whitespace-nowrap">{{ winnerText }}</span>
    <button type="button"
      class="mt-2 px-4 py-2 bg-linear-to-r from-red-600 to-yellow-600 border-none rounded-lg text-white font-semibold shadow-lg cursor-pointer"
      (click)="onContinue()">
      Continue
    </button>
  </div>


</div>


<!-- Spin Button -->
<div
  class="flex flex-row items-center justify-center w-full absolute top-[525px]">
  <button
    class="absolute flex-col items-center justify-center
                   w-35 h-13
                   bg-linear-to-r from-red-600 to-yellow-600 border-none rounded-lg text-white font-semibold shadow-lg cursor-pointer z-60
                   disabled:bg-linear-to-r disabled:from-gray-600 disabled:to-gray-500 disabled:text-gray-300 disabled:cursor-not-allowed disabled:opacity-80 spin-btn"
    [disabled]="spinCount <= 0 || isSpinning" (click)="spinWheel()">
    <div class="text-[10px] tracking-wide font-geologica">NO. OF FREE SPIN</div>
    <div class="text-sm font-geologica font-bold">{{ spinCount }} SPIN</div>
  </button>
</div>
