<div class="inline-block p-[2px] rounded-lg transition-all duration-300 ease-in-out hover:scale-[1.05]"
  [style.background]="getBorderGradient()"
  [style.boxShadow]="getGlowShadow()">

  <div class="flex flex-col items-center justify-center text-center
       bg-black/85 rounded-md
         w-[120px] h-[60px]
       transition-all duration-200 ease-in-out
       shadow-none hover:shadow-[0_0_15px_rgba(255,255,255,0.2)]">

    <p class="text-white/80 text-[10px] tracking-wide font-medium m-0 font-geologica">
      REQUIRED VIP LEVEL
    </p>

    <div class="flex items-center justify-center gap-2 m-0">
      <img src="assets/images/VBADGE.png" alt="Badge" class="w-3 h-3 object-contain" />
      <h2 class="text-white font-geologica font-bold text-base m-0">
        {{ getVipNumber() }}
      </h2>
    </div>
  </div>
</div>
